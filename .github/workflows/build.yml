name: Build InfoPanel Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build InfoPanel SDK
      run: |
        git clone https://github.com/habibrehmansg/infopanel.git ../infopanel_repo
        dotnet build ../infopanel_repo/InfoPanel.Plugins/InfoPanel.Plugins.csproj -c Release -o ./lib

    - name: Restore NuGet Packages
      run: |
        dotnet restore InfoPanel.SystemIdentifiers.csproj

    - name: Build Plugin
      run: |
        dotnet publish InfoPanel.SystemIdentifiers.csproj -c Release -o ./staging/InfoPanel.SystemIdentifiers

    - name: Include Plugin Metadata
      run: |
        Copy-Item -Path "PluginInfo.ini" -Destination "./staging/InfoPanel.SystemIdentifiers/"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InfoPanel.SystemIdentifiers
        path: ./staging/InfoPanel.SystemIdentifiers/
